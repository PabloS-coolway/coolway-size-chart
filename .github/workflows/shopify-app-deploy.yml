# Publica en Shopify la configuración de la app y la Theme App Extension.
#
# POR QUÉ EXISTE: el CLAUDE.md de este repo exige que `shopify app deploy` salga de CI y nunca del
# portátil de nadie. Hasta el 29-sep-2026 esa regla no se podía cumplir, porque no había CI.
#
# POR QUÉ SE LANZA A MANO Y NO EN CADA PUSH: este comando NO despliega el servidor web (eso lo hace
# DigitalOcean solo al mergear). Lo que hace es publicar una VERSIÓN de la app, y al publicarla la
# extensión llega de golpe a TODAS las tiendas donde esté instalada. El propio CLAUDE.md manda
# desplegar por olas —piloto → 3 tiendas → resto, con parada humana entre ellas—, así que
# automatizarlo en cada merge convertiría esa regla en papel mojado. Lo dispara una persona, desde
# la pestaña Actions, y queda registrado quién y cuándo.
name: Publicar la app en Shopify

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: 'Qué se publica y por qué (queda en la versión de la app)'
        required: true
        type: string
      solo_crear_version:
        description: 'Crear la versión SIN publicarla a las tiendas (para revisarla antes)'
        required: false
        type: boolean
        default: false

# Una publicación cada vez: dos a la vez dejarían la versión viva a cara o cruz.
concurrency:
  group: shopify-app-deploy
  cancel-in-progress: false

jobs:
  publicar:
    name: shopify app deploy
    runs-on: ubuntu-latest
    # `environment` permite exigir aprobación humana en Settings → Environments → produccion.
    environment: produccion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # NO el mínimo que declara package.json (">=22.12"): ese rango se quedó corto. La
          # dependencia `@shopify/polaris-types@1.0.7` exige `node >=22.18.0`, y como el `.npmrc`
          # lleva `engine-strict=true`, npm no avisa — falla el `npm ci` entero (EBADENGINE).
          # 22.18.0 es además la versión con la que se desarrolla, así que CI y portátil coinciden.
          node-version: '22.18.0'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Versión FIJADA, no `@latest`: si no, el día que Shopify saque una versión nueva del CLI el
      # despliegue cambia de comportamiento solo, sin que nadie haya tocado el repo.
      - name: Instalar el CLI de Shopify
        run: npm install -g @shopify/cli@4.8.2

      - name: Publicar
        env:
          # Token de automatización de la app (Dev Dashboard → la app → Settings → App Automation
          # Token). Sustituye a los antiguos CLI tokens del Partner Dashboard desde mayo de 2026.
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          MENSAJE: ${{ inputs.mensaje }}
        # --allow-updates y NUNCA --allow-deletes: borrar configuración o extensiones borra también
        # los datos que tengan en las tiendas. Si algún día hay que borrar algo de verdad, se hace
        # en una ejecución aparte y a conciencia, no en el camino de todos los días.
        run: |
          shopify app deploy \
            --allow-updates \
            ${{ inputs.solo_crear_version && '--no-release' || '' }} \
            --source-control-url "$COMMIT_URL" \
            --message "$MENSAJE"

      - name: Recordatorio del orden de instalación
        if: success()
        run: |
          echo "::notice title=Publicado::La versión ya está en Shopify."
          echo "::notice title=Y ahora::Instalar por olas, como manda el CLAUDE.md: primero coolway-sandbox, después Chile, y solo entonces el resto. Nunca las 14 a la vez."
