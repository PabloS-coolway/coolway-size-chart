# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "64029b531d09105987061455b642191b"
name = "coolway-size-chart"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = [ "products/create" ]

  # Tarea 2.4 — recálculo masivo al cambiar una regla o guía.
  # NOTA: Shopify exige un "filter" en las suscripciones de metaobjects/* (lo
  # descubrimos al fallar "shopify app deploy" sin él). La sintaxis del
  # filtro ("type:size_guide_rule") ya está confirmada con un deploy exitoso.
  [[webhooks.subscriptions]]
  uri = "/webhooks/metaobjects/update"
  topics = [ "metaobjects/update" ]
  filter = "type:size_guide_rule"

  [[webhooks.subscriptions]]
  uri = "/webhooks/metaobjects/update"
  topics = [ "metaobjects/update" ]
  filter = "type:size_guide"

  [[webhooks.subscriptions]]
  uri = "/webhooks/metaobjects/create"
  topics = [ "metaobjects/create" ]
  filter = "type:size_guide_rule"

  [[webhooks.subscriptions]]
  uri = "/webhooks/metaobjects/create"
  topics = [ "metaobjects/create" ]
  filter = "type:size_guide"

  [[webhooks.subscriptions]]
  uri = "/webhooks/metaobjects/delete"
  topics = [ "metaobjects/delete" ]
  filter = "type:size_guide_rule"

  [[webhooks.subscriptions]]
  uri = "/webhooks/metaobjects/delete"
  topics = [ "metaobjects/delete" ]
  filter = "type:size_guide"

  # Tarea 2.6 — webhooks obligatorios de cumplimiento (GDPR/CCPA).
  # NOTA (corregido tras error real de "npm run dev"): estos 3 NO se declaran
  # como [[webhooks.subscriptions]] normales — Shopify los rechaza ahí con
  # "The following topic is invalid". Van en su propio bloque dedicado
  # [webhooks.privacy_compliance], con un campo de URL por webhook en vez de
  # topics+uri. Ver docs/gdpr-webhooks.md.
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_files añadido en la Pieza G6 (2.10) — necesario para que la mutación
# fileCreate funcione al subir imágenes nuevas desde el panel propio. Error
# real confirmado sin este scope: "Access denied for fileCreate field.
# Required access: write_files access scope, write_themes access scope or
# write_images access scope."
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_files"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
